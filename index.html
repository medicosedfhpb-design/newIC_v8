    <div id="setup-section" class="setup-box">
        <h3>⚙️ Paso Único: Compilar Aplicación</h3>
        <input type="file" id="pdfFile" accept="application/pdf" style="margin-bottom: 15px;">
        <button class="btn" onclick="crearAppPortatil()">Crear y Descargar App Portátil IC</button>
        <div id="status-setup" style="margin-top: 10px; font-weight: bold;"></div>
    </div>
    <div id="app-section" style="display: none;">
        <div class="section-title">1. Datos de Origen</div>
        <div class="grid">
            <div class="form-group"><label>Servicio de Salud</label><input type="text" id="origen_ss" value="SSVQP"></div>
            <div class="form-group"><label>Establecimiento</label><input type="text" id="origen_est" value="H. Peñablanca"></div>
            <div class="form-group"><label>Especialidad / Servicio</label><input type="text" id="origen_esp" value="Medicina"></div>
            <div class="form-group"><label>Unidad de Origen</label><select id="origen_uni"><option value="Medicina HPB">Medicina HPB</option><option value="Urgencia HPB">Urgencia HPB</option></select></div>
        </div>
        <div class="section-title">2. Identificación del Paciente</div>
        <div class="grid">
            <div class="form-group"><label>Nombres</label><input type="text" id="pac_nom"></div>
            <div class="form-group"><label>Apellido Paterno</label><input type="text" id="pac_ap"></div>
            <div class="form-group"><label>Apellido Materno</label><input type="text" id="pac_am"></div>
            <div class="form-group"><label>RUT</label><input type="text" id="pac_rut" placeholder="Sin puntos, con guión"></div>
            <div class="form-group"><label>6. Historia Clínica (Ficha)</label><input type="text" id="ficha"></div>
            <div class="form-group"><label>Sexo</label><select id="sexo"><option value="">Seleccionar...</option><option value="M">Masculino</option><option value="F">Femenino</option></select></div>
            <div class="form-group"><label>Fch. Nacimiento (DD/MM/AAAA)</label><input type="text" id="fecha_nac" placeholder="DD/MM/AAAA" maxlength="10"></div>
            <div class="form-group"><label>Edad (Años)</label><input type="number" id="edad" readonly style="background-color: #f0f0f0;"></div>
        </div>
        <div class="section-title">3. Destino y Motivo</div>
        <div class="grid">
            <div class="form-group"><label>Servicio de Salud Destino</label><input type="text" id="dest_ss" value="SSVQP"></div>
            <div class="form-group"><label>Hospital / Estab. Destino</label><input type="text" id="dest_hosp" value="H. Quilpué"></div>
            <div class="form-group"><label>Especialidad Destino</label><input type="text" id="dest_esp"></div>
            <div class="form-group"><label>Motivo de Derivación</label><select id="motivo" onchange="document.getElementById('motivo_otro_div').style.display = this.value === 'OTRO' ? 'flex' : 'none'"><option value="">Seleccionar...</option><option value="CONF">Confirmación Diagnóstica</option><option value="TRAT">Realizar Tratamiento</option><option value="SEG">Seguimiento</option><option value="OTRO">Otro...</option></select></div>
            <div class="form-group col-span-2" id="motivo_otro_div" style="display: none;"><label>Especificar Otro Motivo</label><input type="text" id="motivo_especificar"></div>
        </div>
        <div class="section-title">4. Antecedentes Clínicos</div>
        <div class="grid">
            <div class="form-group col-span-3">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <label>Hipótesis Diagnósticas</label>
                    <span id="info_hipotesis" style="font-size:12px; font-weight:bold; color:#2e7d32;"></span>
                </div>
                <textarea id="hipotesis" oninput="verificarLimitesTexto()"></textarea>
            </div>
            <div class="form-group col-span-3">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <label>Fundamentos del Diagnóstico</label>
                    <span id="info_fundamentos" style="font-size:12px; font-weight:bold; color:#2e7d32;"></span>
                </div>
                <textarea id="fundamentos" oninput="verificarLimitesTexto()"></textarea>
            </div>
            <div class="form-group col-span-3">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <label>Exámenes Realizados</label>
                    <span id="info_examenes" style="font-size:12px; font-weight:bold; color:#2e7d32;"></span>
                </div>
                <textarea id="examenes" oninput="verificarLimitesTexto()"></textarea>
            </div>
        </div>
        <div class="section-title">5. Médico Solicitante</div>
        <div class="grid">
            <div class="form-group"><label>Nombres</label><input type="text" id="med_nom"></div>
            <div class="form-group"><label>Apellido Paterno</label><input type="text" id="med_ap"></div>
            <div class="form-group"><label>Apellido Materno</label><input type="text" id="med_am"></div>
            <div class="form-group"><label>RUT Médico (Opcional)</label><input type="text" id="med_rut" placeholder="Sin puntos, con guión"></div>
        </div>
        <button class="btn" onclick="generarIC()">Generar Interconsulta (PDF)</button>
        <div id="status" style="text-align: center; margin-top: 15px; font-weight: bold;"></div>
    </div>
</div>
<script>
    window.onload = function() {
        if (embeddedPdfBase64 && embeddedPdfBase64.length > 100 && !embeddedPdfBase64.includes("PLACEHOLDER")) {
            document.getElementById('setup-section').style.display = 'none';
            document.getElementById('app-section').style.display = 'block';
        }
    };
    function crearAppPortatil() {
        const fileInput = document.getElementById('pdfFile');
        if (fileInput.files.length === 0) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const base64 = e.target.result;
            let currentHTML = "<!DOCTYPE html>\n<html lang=\"es\">\n" + document.documentElement.innerHTML + "\n</html>";
            currentHTML = currentHTML.replace('<!-- PDF_BASE64_PLACEHOLDER -->', base64);
            const blob = new Blob([currentHTML], { type: "text/html" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "Generador_IC_V6.html";
            link.click();
        };
        reader.readAsDataURL(fileInput.files[0]);
    }
    document.getElementById('fecha_nac').addEventListener('input', function(e) {
        let v = e.target.value.replace(/\D/g, '');
        if (v.length > 8) v = v.slice(0, 8);
        if (v.length >= 5) e.target.value = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4);
        else if (v.length >= 3) e.target.value = v.slice(0, 2) + '/' + v.slice(2);
        else e.target.value = v;
        if (e.target.value.length === 10) {
            const parts = e.target.value.split('/');
            const d = parseInt(parts[0], 10), m = parseInt(parts[1], 10), y = parseInt(parts[2], 10);
            const nac = new Date(y, m - 1, d), hoy = new Date();
            let edad = hoy.getFullYear() - nac.getFullYear();
            const mes = hoy.getMonth() - nac.getMonth();
            if (mes < 0 || (mes === 0 && hoy.getDate() < nac.getDate())) edad--;
            document.getElementById('edad').value = edad >= 0 ? edad : 0;
        }
    });
    function safeDrawText(page, text, mappedX, mappedY, size, font) {
        if (!text) return;
        const pdfWidth = page.getWidth(), pdfHeight = page.getHeight();
        const actualX = (mappedX / 595) * pdfWidth;
        const actualY = pdfHeight - (((842 - mappedY) / 842) * pdfHeight);
        page.drawText(String(text), { x: actualX, y: actualY, size: size, font: font });
    }
    const textBoxesConfig = {
        hipotesis: { x: 45, y: 445, xMax: 570, yBottom: 340, fontSize: 8.5, lineHeight: 10.5 },
        fundamentos: { x: 45, y: 230, xMax: 570, yBottom: 180, fontSize: 8.5, lineHeight: 10.5 },
        examenes: { x: 45, y: 145, xMax: 570, yBottom: 95, fontSize: 8.5, lineHeight: 10.5 }
    };
    function verificarLimitesTexto() {
        ['hipotesis', 'fundamentos', 'examenes'].forEach(id => {
            const cfg = textBoxesConfig[id];
            const el = document.getElementById(id);
            const info = document.getElementById('info_' + id);
            if (!el || !info) return;
            const maxLines = Math.max(1, Math.floor((cfg.y - cfg.yBottom) / cfg.lineHeight) + 1);
            const approxCharsPerLine = Math.floor((cfg.xMax - cfg.x) / (cfg.fontSize * 0.52));
            const paragraphs = (el.value || '').split(/\r?\n/);
            let usedLines = 0;
            paragraphs.forEach(p => {
                if (!p.trim()) { usedLines += 1; return; }
                usedLines += Math.ceil(p.length / approxCharsPerLine);
            });
            if (!el.value) usedLines = 0;
            if (usedLines > maxLines) {
                info.style.color = '#d32f2f';
                info.innerText = '⚠️ Excede el recuadro (' + usedLines + '/' + maxLines + ' líneas máx - se recortará el exceso)';
                el.style.borderColor = '#d32f2f';
            } else {
                info.style.color = '#2e7d32';
                info.innerText = usedLines + ' / ' + maxLines + ' líneas';
                el.style.borderColor = '#ccc';
            }
        });
    }
    function safeDrawMultilineBox(page, text, cfg, font) {
        if (!text) return;
        const pdfWidth = page.getWidth(), pdfHeight = page.getHeight();
        const actualX = (cfg.x / 595) * pdfWidth;
        const scaledMaxWidth = ((cfg.xMax - cfg.x) / 595) * pdfWidth;
        const scaledLineHeight = (cfg.lineHeight / 842) * pdfHeight;
        let currentY = pdfHeight - (((842 - cfg.y) / 842) * pdfHeight);
        const minY = pdfHeight - (((842 - cfg.yBottom) / 842) * pdfHeight);
        const paragraphs = String(text).split(/\r?\n/);
        const lines = [];
        for (let p = 0; p < paragraphs.length; p++) {
            const words = paragraphs[p].split(/\s+/).filter(Boolean);
            if (words.length === 0) { lines.push(''); continue; }
            let currentLine = '';
            for (let i = 0; i < words.length; i++) {
                const testLine = currentLine ? (currentLine + ' ' + words[i]) : words[i];
                if (font.widthOfTextAtSize(testLine, cfg.fontSize) > scaledMaxWidth && currentLine !== '') {
                    lines.push(currentLine);
                    currentLine = words[i];
                } else currentLine = testLine;
            }
            if (currentLine) lines.push(currentLine);
        }
        for (let i = 0; i < lines.length; i++) {
            if (currentY < minY - 0.5) break;
            if (lines[i] !== '') page.drawText(lines[i], { x: actualX, y: currentY, size: cfg.fontSize, font: font });
            currentY -= scaledLineHeight;
        }
    }
    function getRutData(inputId) {
        let val = document.getElementById(inputId).value || '';
        let raw = val.replace(/[^0-9kK]/g, '').toUpperCase();
        if(raw.length < 2) return null;
        return { num: raw.slice(0, -1).padStart(8, '0'), dv: raw.slice(-1) };
    }
    function getDateData(inputId) {
        let val = document.getElementById(inputId).value || '';
        let raw = val.replace(/\D/g, '');
        return raw.length === 8 ? raw : null;
    }
    async function generarIC() {
        const base64Data = embeddedPdfBase64.split(',')[1];
        const binaryString = window.atob(base64Data);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
        const srcDoc = await PDFLib.PDFDocument.load(bytes.buffer);
        const pdfDoc = await PDFLib.PDFDocument.create();
        const [embeddedPage] = await pdfDoc.embedPdf(srcDoc);
        const w = embeddedPage.width, h = embeddedPage.height;
        const baseRot = 180;
        let page;
        if (baseRot === 180) {
            page = pdfDoc.addPage([w, h]);
            page.drawPage(embeddedPage, { x: w, y: h, width: w, height: h, rotate: PDFLib.degrees(180) });
        } else if (baseRot === 90) {
            page = pdfDoc.addPage([h, w]);
            page.drawPage(embeddedPage, { x: 0, y: w, width: w, height: h, rotate: PDFLib.degrees(-90) });
        } else if (baseRot === 270) {
            page = pdfDoc.addPage([h, w]);
            page.drawPage(embeddedPage, { x: h, y: 0, width: w, height: h, rotate: PDFLib.degrees(90) });
        } else {
            page = pdfDoc.addPage([w, h]);
            page.drawPage(embeddedPage, { x: 0, y: 0, width: w, height: h });
        }
        const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
        const boldFont = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
        const size = 11, digitSize = 12;
        const coords = {
            hoy: [{"x":287,"y":770},{"x":302,"y":770},{"x":325,"y":770},{"x":339,"y":770},{"x":362,"y":770},{"x":379,"y":770},{"x":392,"y":770},{"x":406,"y":770}],
            nac: [{"x":211,"y":600},{"x":225,"y":600},{"x":245,"y":600},{"x":260,"y":600},{"x":279,"y":600},{"x":294,"y":600},{"x":306,"y":600},{"x":324,"y":600}],
            rut: [{"x":80,"y":635},{"x":96,"y":635},{"x":111,"y":635},{"x":124,"y":635},{"x":140,"y":635},{"x":157,"y":635},{"x":170,"y":635},{"x":182,"y":635}],
            dv: {x: 211, y: 635},
            ficha: [{"x":445,"y":690},{"x":460,"y":690},{"x":475,"y":690},{"x":490,"y":690},{"x":505,"y":690},{"x":520,"y":690},{"x":535,"y":690},{"x":550,"y":690},{"x":565,"y":690}],
            edad: [{"x":444,"y":605},{"x":456,"y":605},{"x":473,"y":605}],
            rut_med: [{"x":82,"y":25},{"x":99,"y":25},{"x":113,"y":25},{"x":127,"y":25},{"x":142,"y":25},{"x":156,"y":25},{"x":170,"y":25},{"x":185,"y":25}],
            dv_med: {x: 213, y: 25}
        };
        const d = new Date();
        const hoyStr = String(d.getDate()).padStart(2, '0') + String(d.getMonth() + 1).padStart(2, '0') + String(d.getFullYear());
        for(let i=0; i<8; i++) safeDrawText(page, hoyStr[i], coords.hoy[i].x, coords.hoy[i].y, digitSize, boldFont);
        const pacRut = getRutData('pac_rut');
        if(pacRut) {
            for(let i=0; i<8; i++) safeDrawText(page, pacRut.num[i], coords.rut[i].x, coords.rut[i].y, digitSize, boldFont);
            safeDrawText(page, pacRut.dv, coords.dv.x, coords.dv.y, digitSize, boldFont);
        }
        const nacStr = getDateData('fecha_nac');
        if(nacStr) for(let i=0; i<8; i++) safeDrawText(page, nacStr[i], coords.nac[i].x, coords.nac[i].y, digitSize, boldFont);
        let edadVal = document.getElementById('edad').value;
        if(edadVal) {
            let edadStr = String(edadVal).padStart(3, ' ');
            for(let i=0; i<3; i++) if(edadStr[i] !== ' ') safeDrawText(page, edadStr[i], coords.edad[i].x, coords.edad[i].y, digitSize, boldFont);
            safeDrawText(page, 'X', 490, 610, 14, boldFont);
        }
        safeDrawText(page, document.getElementById('origen_ss').value.toUpperCase(), 40, 740, size, font);
        safeDrawText(page, document.getElementById('origen_est').value.toUpperCase(), 270, 740, size, font);
        safeDrawText(page, (document.getElementById('origen_esp').value || '').toUpperCase(), 40, 715, size, font);
        safeDrawText(page, document.getElementById('origen_uni').value.toUpperCase(), 325, 715, size, font);
        safeDrawText(page, (document.getElementById('pac_ap').value || '').toUpperCase(), 50, 670, size, font);
        safeDrawText(page, (document.getElementById('pac_am').value || '').toUpperCase(), 220, 670, size, font);
        safeDrawText(page, (document.getElementById('pac_nom').value || '').toUpperCase(), 360, 670, size, font);
        const fichaRaw = (document.getElementById('ficha').value || '').replace(/\s+/g, '').toUpperCase();
        if (fichaRaw) {
            for (let i = 0; i < Math.min(fichaRaw.length, coords.ficha.length); i++) {
                safeDrawText(page, fichaRaw[i], coords.ficha[i].x, coords.ficha[i].y, digitSize, boldFont);
            }
        }
        safeDrawText(page, document.getElementById('dest_ss').value.toUpperCase(), 80, 505, size, font);
        let destHospVal = (document.getElementById('dest_hosp').value || '').toUpperCase();
        safeDrawText(page, destHospVal, 200, 505, size, font);
        safeDrawText(page, (document.getElementById('dest_esp').value || '').toUpperCase(), 380, 505, size, font);
        safeDrawText(page, (document.getElementById('med_ap').value || '').toUpperCase(), 45, 55, size, font);
        safeDrawText(page, (document.getElementById('med_am').value || '').toUpperCase(), 210, 55, size, font);
        safeDrawText(page, (document.getElementById('med_nom').value || '').toUpperCase(), 350, 55, size, font);
        const medRut = getRutData('med_rut');
        if(medRut) {
            for(let i=0; i<8; i++) safeDrawText(page, medRut.num[i], coords.rut_med[i].x, coords.rut_med[i].y, digitSize, boldFont);
            safeDrawText(page, medRut.dv, coords.dv_med.x, coords.dv_med.y, digitSize, boldFont);
        }
        const sexo = document.getElementById('sexo').value;
        if(sexo === 'M') safeDrawText(page, 'X', 100, 610, 14, boldFont);
        if(sexo === 'F') safeDrawText(page, 'X', 100, 600, 14, boldFont);
        const motivo = document.getElementById('motivo').value;
        if(motivo === 'CONF') safeDrawText(page, 'X', 165, 485, 14, boldFont);
        if(motivo === 'TRAT') safeDrawText(page, 'X', 165, 475, 14, boldFont);
        if(motivo === 'SEG') safeDrawText(page, 'X', 220, 485, 14, boldFont);
        if(motivo === 'OTRO') {
            safeDrawText(page, 'X', 220, 475, 14, boldFont);
            safeDrawText(page, (document.getElementById('motivo_especificar').value || ''), 300, 475, size, font);
        }
        safeDrawMultilineBox(page, document.getElementById('hipotesis').value, textBoxesConfig.hipotesis, font);
        safeDrawMultilineBox(page, document.getElementById('fundamentos').value, textBoxesConfig.fundamentos, font);
        safeDrawMultilineBox(page, document.getElementById('examenes').value, textBoxesConfig.examenes, font);
        const pdfBytes = await pdfDoc.save();
        const blob = new Blob([pdfBytes], { type: "application/pdf" });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = "Interconsulta_" + (document.getElementById('pac_nom').value || 'Generada').replace(/\s+/g, '_') + ".pdf";
        link.click();
    }
</script>
</body>
</html>
